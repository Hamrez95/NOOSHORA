name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  storefront:
    name: Storefront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Production static preview build
        run: npm run build
        env:
          NOOSHORA_STATIC_EXPORT: 'true'
      - name: Upload storefront preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: nooshora-storefront-preview
          path: apps/storefront/out

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nooshora
          POSTGRES_PASSWORD: nooshora_ci
          POSTGRES_DB: nooshora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nooshora -d nooshora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Catalog: Host=127.0.0.1;Port=5432;Database=nooshora;Username=nooshora;Password=nooshora_ci
      Admin__Email: ci-owner@nooshora.test
      Admin__PasswordHash: 43dd5a8b5cc3e17fcd37c7ccf9aa9206e422d75d66f4fc99cbf9adb66656d708
      Admin__TokenSigningKey: nooshora-ci-signing-key-must-be-long-and-private
      Payments__SandboxEnabled: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore services/api/Nooshora.Api.csproj
      - name: Build
        run: dotnet build services/api/Nooshora.Api.csproj --configuration Release --no-restore
      - name: Durable checkout and payment contract
        shell: bash
        run: |
          set -euo pipefail
          start_api() {
            dotnet run --project services/api/Nooshora.Api.csproj --configuration Release --no-build --urls http://127.0.0.1:5099 > /tmp/nooshora-api.log 2>&1 &
            API_PID=$!
            export API_PID
            for attempt in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:5099/health > /dev/null; then return 0; fi
              sleep 1
            done
            cat /tmp/nooshora-api.log
            return 1
          }
          stop_api() {
            kill "$API_PID" || true
            wait "$API_PID" || true
          }
          trap 'stop_api' EXIT
          start_api

          curl -fsS -X POST http://127.0.0.1:5099/api/v1/checkout/orders \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-checkout-0001' \
            --data '{"customerName":"تست CI","mobile":"09120000000","province":"تهران","city":"تهران","address":"نشانی تست قرارداد","postalCode":"1234567890","lines":[{"sku":"PI-AKB-250","quantity":1}]}' \
            > /tmp/order-created.json

          curl -fsS -X POST http://127.0.0.1:5099/api/v1/checkout/orders \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-checkout-0001' \
            --data '{"customerName":"تست CI","mobile":"09120000000","province":"تهران","city":"تهران","address":"نشانی تست قرارداد","postalCode":"1234567890","lines":[{"sku":"PI-AKB-250","quantity":1}]}' \
            > /tmp/order-replayed.json

          python3 - <<'PY'
          import json
          created = json.load(open('/tmp/order-created.json', encoding='utf-8'))
          replayed = json.load(open('/tmp/order-replayed.json', encoding='utf-8'))
          assert created['id'] == replayed['id'], 'idempotent retry created another order'
          assert created['payable'] == replayed['payable'], 'replayed total changed'
          assert created['state'] == 'AwaitingPayment'
          open('/tmp/order-id', 'w').write(created['id'])
          open('/tmp/receipt-token', 'w').write(created['receiptToken'])
          PY

          stop_api
          start_api
          ORDER_ID=$(cat /tmp/order-id)
          RECEIPT_TOKEN=$(cat /tmp/receipt-token)
          curl -fsS "http://127.0.0.1:5099/api/v1/checkout/orders/${ORDER_ID}?receiptToken=${RECEIPT_TOKEN}" \
            > /tmp/order-after-restart.json

          curl -fsS -X POST "http://127.0.0.1:5099/api/v1/payments/orders/${ORDER_ID}/intent" \
            -H 'Content-Type: application/json' \
            --data "{\"receiptToken\":\"${RECEIPT_TOKEN}\"}" \
            > /tmp/payment-intent.json
          AUTHORITY=$(python3 -c "import json; print(json.load(open('/tmp/payment-intent.json'))['authority'])")

          curl -fsS -X POST "http://127.0.0.1:5099/api/v1/payments/sandbox/${AUTHORITY}/complete" \
            -H 'Content-Type: application/json' \
            --data "{\"receiptToken\":\"${RECEIPT_TOKEN}\"}" \
            > /tmp/payment-completed.json
          curl -fsS -X POST "http://127.0.0.1:5099/api/v1/payments/sandbox/${AUTHORITY}/complete" \
            -H 'Content-Type: application/json' \
            --data "{\"receiptToken\":\"${RECEIPT_TOKEN}\"}" \
            > /tmp/payment-replayed.json

          python3 - <<'PY'
          import json
          order = json.load(open('/tmp/order-after-restart.json', encoding='utf-8'))
          completed = json.load(open('/tmp/payment-completed.json', encoding='utf-8'))
          replayed = json.load(open('/tmp/payment-replayed.json', encoding='utf-8'))
          assert order['state'] == 'AwaitingPayment', 'order changed before payment'
          assert completed['id'] == replayed['id'], 'callback replay changed payment identity'
          assert completed['state'] == 'Succeeded', 'sandbox payment did not succeed'
          assert completed['reference'], 'payment reference missing'
          PY

          stop_api
          start_api
          curl -fsS "http://127.0.0.1:5099/api/v1/checkout/orders/${ORDER_ID}?receiptToken=${RECEIPT_TOKEN}" \
            > /tmp/order-paid-after-restart.json
          python3 - <<'PY'
          import json
          paid = json.load(open('/tmp/order-paid-after-restart.json', encoding='utf-8'))
          assert paid['state'] == 'Paid', 'paid state did not survive restart'
          assert len(paid['transitions']) == 2, 'payment transition history was not persisted'
          assert paid['transitions'][-1]['state'] == 'Paid'
          PY

  admin:
    name: Admin Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Generate platform runners
        run: flutter create --platforms=android,web --project-name nooshora_admin .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build authenticated web
        run: flutter build web --release --target lib/secure_main.dart
      - name: Build authenticated Android test APK
        run: flutter build apk --debug --target lib/secure_main.dart
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: nooshora-admin-web
          path: apps/admin/build/web
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: nooshora-admin-apk-debug
          path: apps/admin/build/app/outputs/flutter-apk/app-debug.apk
